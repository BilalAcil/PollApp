<div class="category-select">
  <button
    type="button"
    class="trigger"
    aria-haspopup="listbox"
    [attr.aria-expanded]="open()"
    (click)="toggle()"
  >
    {{ triggerLabel() }}
    <span class="arrow" [class.up]="open()" aria-hidden="true"></span>
  </button>

  @if (selectedLabel(); as label) {
    <p class="selected-label">{{ label }}</p>
  }

  @if (open()) {
    <ul class="options" role="listbox">
      @if (showAllOption()) {
        <li role="option" [attr.aria-selected]="value() === allCategories">
          <button type="button" (click)="select(allCategories)">
            {{ placeholderLabel() }}
          </button>
        </li>
      }
      @for (category of categories; track category.value) {
        <li role="option" [attr.aria-selected]="value() === category.value">
          <button type="button" (click)="select(category.value)">
            {{ category.label }}
          </button>
        </li>
      }
    </ul>
  }
</div>
