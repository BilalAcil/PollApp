name: Supabase keep-alive

# Free-Plan-Projekte werden nach ca. 1 Woche ohne Aktivität pausiert.
# Diese Action fragt alle 3 Tage die API ab und hält das Projekt aktiv.
on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping Supabase
        run: |
          FILE=poll-app/src/environments/environment.ts
          URL=$(grep -oP "supabaseUrl: '\K[^']+" "$FILE")
          KEY=$(grep -oP "supabaseKey: '\K[^']+" "$FILE")
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" \
            "$URL/rest/v1/surveys?select=id&limit=1")
          echo "Supabase responded with HTTP $STATUS"
          test "$STATUS" = "200"
